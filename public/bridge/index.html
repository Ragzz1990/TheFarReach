<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ship Bridge — The Far Reach</title><meta name="description" content="Public player-facing Far Reach starship bridge display."><link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/css/bridge.css"></head>
<body data-page="bridge" data-bridge-mode="NORMAL"><main class="bridge-deck">
<header class="bridge-top"><a href="/home/" class="bridge-mark">◇ THE FAR REACH</a><div class="bridge-clock"><span>BRIDGE NETWORK</span><b id="bridgeClock">--:--:--</b></div><div class="bridge-player-tools"><button id="bridgeMute" type="button" aria-pressed="false">SOUND STANDBY</button><button id="bridgeFullscreen" type="button">FULLSCREEN</button></div></header>
<section class="bridge-viewport" aria-label="Forward ship viewport"><div class="starfield stars-a"></div><div class="starfield stars-b"></div><div class="viewport-planet" id="viewportPlanet"></div><div class="distant-station" aria-hidden="true"><i></i><span></span></div><div class="viewport-frame top"></div><div class="viewport-frame left"></div><div class="viewport-frame right"></div><div class="viewport-caption"><span>FORWARD OPTICS</span><b id="viewportLocation">DEEP SPACE</b></div></section>
<section id="bridgeAlert" class="bridge-alert" hidden><span id="alertType">ALERT</span><strong id="alertTitle"></strong><p id="alertDetail"></p><button id="dismissAlert" type="button">DISMISS</button></section>
<section class="bridge-hologram-zone"><div class="projection-cone"></div><div id="bridgeHologram" class="bridge-hologram type-silhouette" hidden><div id="hologramVisual" class="hologram-visual"><img id="hologramImage" alt="" hidden><div class="fallback-hologram"><span class="fh-head"></span><span class="fh-body"></span><b id="hologramGlyph">◇</b></div></div><div class="bridge-transmission"><div><span id="hologramName">UNKNOWN CONTACT</span><small id="hologramMeta"></small></div><p id="hologramText"></p><i class="type-cursor"></i></div></div><div class="bridge-projector"><span></span><b>HOLO ARRAY</b><small id="holoArrayStatus">STANDBY</small></div></section>
<section class="bridge-console bridge-nav"><header><span>NAVCOM</span><b id="bridgeMode">NORMAL</b></header><div class="radar"><i></i><i></i><i></i><b></b></div><dl><div><dt>ORIGIN</dt><dd id="navOrigin">—</dd></div><div><dt>DESTINATION</dt><dd id="navDestination">—</dd></div><div><dt>ROUTE</dt><dd id="navStatus">ROUTE STANDBY</dd></div></dl></section>
<section class="bridge-console bridge-comms"><header><span>COMMUNICATIONS</span><b id="commsState">LISTENING</b></header><div class="comms-wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><p id="eventDetail">NO PRIORITY TRAFFIC</p></section>
<section class="bridge-console bridge-status"><header><span id="shipName">PALE HOUND</span><b id="shipAlertState">NORMAL</b></header><div class="ship-meters" id="shipMeters"></div><dl class="ship-position"><div><dt>LOCATION</dt><dd id="shipLocation">DEEP SPACE</dd></div><div><dt>DESTINATION</dt><dd id="shipDestination">—</dd></div></dl></section>
<div class="deck-lights left"><i></i><i></i><i></i></div><div class="deck-lights right"><i></i><i></i><i></i></div><div class="bridge-scanlines"></div></main>
<script src="/js/bridge-state.js"></script><script src="/js/bridge.js"></script></body></html>
